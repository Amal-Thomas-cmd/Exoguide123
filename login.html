rel="stylesheet">


<style>

*{
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{

margin:0;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:
linear-gradient(135deg,#020617,#1e1b4b,#312e81);

}


/* Animated galaxy */

body:before{

content:"";

position:absolute;

width:200%;
height:200%;

background-image:
radial-gradient(circle,#fff 1px,transparent 1px);

background-size:55px 55px;

opacity:.25;

animation:
moveStars 50s linear infinite;

}


@keyframes moveStars{

from{
transform:translateY(0);
}

to{
transform:translateY(-600px);
}

}


/* Purple glow */

body:after{

content:"";

position:absolute;

width:600px;
height:600px;

background:#8b5cf6;

filter:blur(180px);

opacity:.35;

}


/* Main cards */

.login-container,
.secret-section{


position:relative;

z-index:2;


width:430px;

padding:45px;


background:
rgba(255,255,255,.08);


border:

1px solid rgba(255,255,255,.18);


border-radius:30px;


backdrop-filter:blur(25px);


box-shadow:
0 30px 80px rgba(0,0,0,.5);


animation:
fade .8s ease;


}


@keyframes fade{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:none;

}

}



h2{

color:white;

text-align:center;

font-size:32px;

margin-bottom:30px;

}



.subtitle{

text-align:center;

color:#c4b5fd;

font-size:14px;

margin-top:-20px;

margin-bottom:25px;

}



/* Input design */


.input-box{

position:relative;

margin-bottom:20px;

}



.input-box i{

position:absolute;

left:18px;

top:50%;

transform:translateY(-50%);

color:#c4b5fd;

}



.input-box input{


width:100%;

padding:16px 45px;


border:none;

outline:none;


border-radius:16px;


background:
rgba(255,255,255,.12);


color:white;

font-size:15px;


}



.input-box input::placeholder{

color:#ddd;

}


.input-box input:focus{

box-shadow:
0 0 20px #8b5cf6;

}



/* password eye */


.eye{

position:absolute;

right:18px;

top:50%;

transform:translateY(-50%);

color:white;

cursor:pointer;

}




/* Button */


.login-btn,
.secret-section button{


width:100%;

padding:16px;


border:none;

border-radius:16px;


background:

linear-gradient(
135deg,
#8b5cf6,
#2563eb
);


color:white;

font-size:16px;

font-weight:600;


cursor:pointer;


transition:.3s;


}



.login-btn:hover,
.secret-section button:hover{


transform:translateY(-3px);


box-shadow:
0 15px 35px rgba(59,130,246,.5);


}



/* Verification */


.verification-box{


display:none;

position:fixed;

z-index:10;


top:50%;
left:50%;


transform:translate(-50%,-50%);


background:
rgba(255,255,255,.95);


padding:35px;


border-radius:25px;


text-align:center;


}



/* Secret notes */


.secret-section{

display:none;

color:white;

}



textarea{


width:100%;

height:180px;


border:none;

outline:none;


border-radius:18px;


padding:18px;


resize:none;


background:
rgba(255,255,255,.12);


color:white;


font-size:15px;


}


.buttons{

display:flex;

flex-direction:column;

gap:12px;

margin-top:20px;

}



.timestamp{

text-align:center;

color:#ddd;

font-size:13px;

margin-top:15px;

}



/* Back button */


.back-button{


position:absolute;

top:25px;

left:25px;


width:45px;

height:45px;


cursor:pointer;


z-index:5;


}



/* Mobile */


@media(max-width:500px){


.login-container,
.secret-section{


width:90%;

padding:30px;


}


}


</style>
